name: Format approved PR

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: read
  actions: write

concurrency:
  group: format-approved-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes

jobs:
  format:
    name: Format the reviewed commit
    if: >-
      github.event.review.state == 'approved' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - name: Check out trusted formatter configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: automation
          persist-credentials: false
      - name: Check out the approved revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.review.commit_id }}
          path: reviewed-pr
          fetch-depth: 0
      - name: Format changed files, push fixes, and rerun CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          nix develop ./automation#hooks --no-update-lock-file --command
          python3 automation/scripts/format-approved-pr.py --checkout reviewed-pr

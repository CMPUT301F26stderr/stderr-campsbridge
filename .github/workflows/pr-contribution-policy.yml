name: PR contribution policy

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-contribution-policy-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes

jobs:
  policy:
    name: Check PR contribution policy
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request != null
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Check out trusted policy code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check PR text and commit messages
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix develop .#repository --no-update-lock-file --command python3 scripts/pr-contribution-policy.py

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify-maps:
        description: Verify the configured Maps SDK with real device gestures
        type: boolean
        default: false

permissions:
  contents: read

# The self-hosted NixOS runner already provides Nix. Enable features for
# workflow commands and nested Nix calls without changing the host config.
env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate repository configuration
        run: nix develop .#repository --no-update-lock-file --command bash scripts/check-repository.sh

  hooks:
    name: Pre-commit checks
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check file syntax, conflicts, size, and secrets
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: nix develop .#hooks --no-update-lock-file --command bash scripts/check-hooks.sh
      - name: Verify repository command behavior
        run: nix develop .#hooks --no-update-lock-file --command python3 -m unittest discover -s scripts/tests -v

  android:
    name: Android checks
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Expose Nix tools to Gradle setup
        run: nix develop .#default --no-update-lock-file --command bash scripts/setup-ci-toolchain.sh
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
        with:
          # Self-hosted runners retain Gradle's home between jobs.
          cache-overwrite-existing: true
      - name: Lint, test, build, and generate API documentation
        env:
          ORG_GRADLE_PROJECT_mapsApiKey: ${{ secrets.MAPS_API_KEY }}
        run: nix develop .#default --no-update-lock-file --command bash scripts/check.sh :app:unitCoverageReport :app:pureLogicCoverage :app:dokkaGeneratePublicationHtml --stacktrace
      - name: Make cached Gradle launchers executable
        if: always()
        run: |
          gradle_distributions="${GRADLE_USER_HOME:-$HOME/.gradle}/wrapper/dists"
          if [[ -d "$gradle_distributions" ]]; then
            find "$gradle_distributions" -type f -path '*/bin/gradle' -exec chmod +x {} +
          fi
      - name: Upload internal build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false
          overwrite: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload API documentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: api-docs
          path: app/build/dokka/html/
          overwrite: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  firebase:
    name: Firebase contracts
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Expose Nix tools to Gradle setup
        run: nix develop .#default --no-update-lock-file --command bash scripts/setup-ci-toolchain.sh
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
        with:
          cache-overwrite-existing: true
      - name: Verify rules and Kotlin repositories with disposable emulators
        run: nix develop .#default --no-update-lock-file --command bash scripts/check-firebase.sh
      - name: Make cached Gradle launchers executable
        if: always()
        run: |
          gradle_distributions="${GRADLE_USER_HOME:-$HOME/.gradle}/wrapper/dists"
          if [[ -d "$gradle_distributions" ]]; then
            find "$gradle_distributions" -type f -path '*/bin/gradle' -exec chmod +x {} +
          fi
      - name: Upload Firebase test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: firebase-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            firebase/tooling/build/reports/
            app/build/reports/tests/firebaseIntegrationTest/
            app/build/test-results/firebaseIntegrationTest/
          if-no-files-found: warn
          retention-days: 14

  ui:
    name: Android UI checks
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run shared-control interactions on a disposable device
        run: nix develop .#ui --no-update-lock-file --command bash scripts/check-android-ui.sh -PmapsApiKey= --stacktrace
      - name: Upload UI reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14

  maps:
    name: Configured Maps verification
    if: github.event_name == 'workflow_dispatch' && inputs.verify-maps
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify actual map load, tap, drag, Apply, and Cancel
        env:
          ORG_GRADLE_PROJECT_mapsApiKey: ${{ secrets.MAPS_API_KEY }}
        run: >-
          nix develop .#ui --no-update-lock-file --command bash scripts/check-android-ui.sh
          -Pandroid.testInstrumentationRunnerArguments.class=io.github.CMPUT301F26stderr.campsbridge.platform.maps.MapsSdkVerificationTest
          -Pandroid.testInstrumentationRunnerArguments.requireConfiguredMaps=true
          --stacktrace
      - name: Upload configured Maps reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: maps-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14

  ready:
    name: CI ready
    needs: [repository, hooks, android, firebase, ui]
    if: ${{ always() }}
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Require every verification job to succeed
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          HOOKS_RESULT: ${{ needs.hooks.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          FIREBASE_RESULT: ${{ needs.firebase.result }}
          UI_RESULT: ${{ needs.ui.result }}
        run: |
          printf 'Repository checks: %s\nPre-commit checks: %s\nAndroid checks: %s\nFirebase contracts: %s\n' \
            "$REPOSITORY_RESULT" "$HOOKS_RESULT" "$ANDROID_RESULT" "$FIREBASE_RESULT"
          printf 'Android UI checks: %s\n' "$UI_RESULT"
          if [[ "$REPOSITORY_RESULT" != success || "$HOOKS_RESULT" != success || "$ANDROID_RESULT" != success || "$FIREBASE_RESULT" != success || "$UI_RESULT" != success ]]; then
            echo 'CI is not ready: every verification job must succeed.' >&2
            exit 1
          fi

  publish:
    name: Publish beta APK
    needs: [ready]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download the verified APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: app-debug.apk
          path: ${{ runner.temp }}/beta-apk-${{ github.run_id }}-${{ github.run_attempt }}
          skip-decompress: true
      - name: Update beta prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ runner.temp }}/beta-apk-${{ github.run_id }}-${{ github.run_attempt }}/app-debug.apk
        run: nix develop .#repository --no-update-lock-file --command bash scripts/publish-apk.sh "$APK_PATH"

  pages:
    name: Publish project site
    needs: [ready]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  # AI review is pending provider selection. Add an independent advisory job
  # here when configured; do not replace the Android checks or human review.

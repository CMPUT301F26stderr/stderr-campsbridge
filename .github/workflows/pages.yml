name: Publish project site

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Build and deploy project site
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Download verified API documentation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-docs
          path: ${{ runner.temp }}/pages-${{ github.run_id }}-${{ github.run_attempt }}/docs
      - name: Build static site
        env:
          SITE_DIR: ${{ runner.temp }}/pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          test -f "$SITE_DIR/docs/index.html"
          mkdir -p "$SITE_DIR/storyboard"
          cp pages/index.html "$SITE_DIR/index.html"
          cp -R pages/halfway-demo "$SITE_DIR/halfway-demo"
          cp prototype/index.html prototype/prototype.css prototype/prototype.js \
            prototype/hotspots.css prototype/wiring.json "$SITE_DIR/storyboard/"
          cp -R prototype/screens "$SITE_DIR/storyboard/screens"
          cp prototype/credits.html "$SITE_DIR/storyboard/credits.html"
          cp -R assets "$SITE_DIR/assets"
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

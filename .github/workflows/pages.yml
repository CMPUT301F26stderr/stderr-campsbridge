name: Publish storyboard

on:
  push:
    branches: [main]
    paths:
      - prototype/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Build and deploy storyboard
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build static site
        env:
          SITE_DIR: ${{ runner.temp }}/storyboard-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p "$SITE_DIR"
          cp prototype/index.html prototype/prototype.css prototype/prototype.js \
            prototype/hotspots.css prototype/wiring.json "$SITE_DIR/"
          cp -R prototype/screens "$SITE_DIR/screens"
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/storyboard-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

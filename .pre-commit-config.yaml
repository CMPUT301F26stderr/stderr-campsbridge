minimum_pre_commit_version: '4.6.2'
default_install_hook_types: [pre-commit]
default_stages: [pre-commit, manual]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        # Keep downloaded screen exports unchanged.
        exclude: '^prototype/screens/'
      - id: end-of-file-fixer
        exclude: '^prototype/screens/'
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-added-large-files
        args: [--maxkb=1024, --enforce-all]

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
        name: Scan staged changes for secrets
        entry: gitleaks git --pre-commit --redact --staged --no-banner
        stages: [pre-commit]
      - id: gitleaks
        alias: gitleaks-checkout
        name: Scan checkout for secrets
        entry: gitleaks dir --redact --no-banner
        stages: [manual]
        always_run: true

  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: 4380fbb73a154b5f5624794c1c78d9719ccc860f # v2.16.0
    hooks:
      - id: pretty-format-kotlin
        alias: ktlint-format
        name: Format Kotlin (ktlint)
        args:
          - --ktlint-version=1.8.0
          - --formatter-jar-checksum=a3fd620207d5c40da6ca789b95e7f823c54e854b7fade7f613e91096a3706d75
          - --autofix
        stages: [pre-commit]
        types: [file]
        files: '\.(kt|kts)$'
      - id: pretty-format-kotlin
        alias: ktlint-check
        name: Check Kotlin formatting (ktlint)
        args:
          - --ktlint-version=1.8.0
          - --formatter-jar-checksum=a3fd620207d5c40da6ca789b95e7f823c54e854b7fade7f613e91096a3706d75
        stages: [manual]
        types: [file]
        files: '\.(kt|kts)$'
